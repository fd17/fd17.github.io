    <style>
      :root {
        color-scheme: light;
        --background: #edf3f0;
        --panel: rgba(255, 255, 255, 0.9);
        --ink: #10251f;
        --muted: #60706a;
        --border: #d4e1dc;
        --grid: #d9d9d9;
        --active: #2a9d8f;
        --shutdown: #d95f59;
        --created: #264653;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 8% 8%, rgba(42, 157, 143, 0.2), transparent 32rem),
          radial-gradient(circle at 92% 18%, rgba(233, 196, 106, 0.2), transparent 28rem),
          linear-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.25) 1px, transparent 1px),
          var(--background);
        background-size: auto, auto, 32px 32px, 32px 32px, auto;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        position: relative;
        width: min(100%, 1640px);
        margin: 0 auto;
        padding: clamp(24px, 4vw, 58px) clamp(12px, 3vw, 36px) 52px;
      }

      main::before {
        position: absolute;
        top: 0;
        left: clamp(12px, 3vw, 36px);
        width: 88px;
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--active), #e9c46a);
        content: "";
      }

      header {
        max-width: 940px;
        margin-bottom: 30px;
      }

      .site-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 34px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 160ms ease, transform 160ms ease;
      }

      .site-link::before {
        color: var(--active);
        content: "←";
        font-size: 1rem;
      }

      .site-link:hover {
        color: var(--created);
        transform: translateX(-2px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--active);
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 5.4rem);
        font-weight: 850;
        line-height: 0.96;
        letter-spacing: -0.065em;
      }

      .intro {
        max-width: 76ch;
        margin: 14px 0 0;
        color: #52605a;
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        line-height: 1.6;
      }

      .chart-frame {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(25, 58, 49, 0.14);
        backdrop-filter: blur(18px);
      }

      svg {
        display: block;
        background:
          linear-gradient(180deg, rgba(42, 157, 143, 0.035), transparent 220px),
          #ffffff;
        font-family: inherit;
      }

      .model-label {
        fill: #29332f;
        font-size: 11px;
      }

      .date-label,
      .today-label {
        fill: var(--muted);
        font-size: 11px;
      }

      .axis-title {
        fill: #29332f;
        font-size: 12px;
      }

      .legend-label {
        fill: #29332f;
        font-size: 12px;
      }

      .grid-line {
        stroke: var(--grid);
        stroke-width: 1;
      }

      .axis-line {
        stroke: #29332f;
        stroke-width: 1;
      }

      .today-line {
        stroke: var(--muted);
        stroke-width: 1.2;
        stroke-dasharray: 5 5;
      }

      .source-note {
        margin: 16px 4px 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.55;
      }

      .source-note a {
        color: var(--created);
      }

      .no-script {
        padding: 24px;
        color: var(--shutdown);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Launches · lifetimes · sunsets</p>
        <h1>OpenAI Model Lifespans</h1>
        <p class="intro">
          Each line begins at the model’s creation date. Green extends through the
          chart horizon when no shutdown is announced; red ends at the announced
          shutdown date.
        </p>
      </header>

      <div class="chart-frame" id="chart-frame">
        <svg id="timeline" role="img" aria-labelledby="chart-title chart-description"></svg>
        <noscript>

        </noscript>
      </div>

        All models returned by the OpenAI 
        <a href="https://developers.openai.com/api/reference/resources/models" rel="noreferrer">
          Models API
        </a>
        .
      </p>
    </main>

                "id": "gpt-live-transcribe",
                "created": 1785168034,
                "shutdown": null
        },
        {
                "id": "gpt-6-astra",
                "created": 1788429600,
                "shutdown": null
        }
];

      const colors = {
        active: "#2a9d8f",
        shutdown: "#d95f59",
        created: "#264653"
      };

      const svg = document.querySelector("#timeline");
      const frame = document.querySelector("#chart-frame");
      const namespace = "http://www.w3.org/2000/svg";

      function makeSvgElement(name, attributes = {}, text = "") {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (text) {
          element.textContent = text;
        }
        return element;
      }

      function utcDateFromUnix(seconds) {
        const value = new Date(seconds * 1000);
        return new Date(Date.UTC(
          value.getUTCFullYear(),
          value.getUTCMonth(),
          value.getUTCDate()
        ));
      }

      function utcDateFromIso(value) {
        return value ? new Date(value + "T00:00:00Z") : null;
      }

      function addUtcMonths(date, count) {
        return new Date(Date.UTC(
          date.getUTCFullYear(),
          date.getUTCMonth() + count,
          1
        ));
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC"
        }).format(date);
      }

      function drawLegend(group, left) {
        const entries = [
          { x: left, color: colors.active, label: "No shutdown announced" },
          { x: left + 250, color: colors.shutdown, label: "Shutdown announced", square: true },
          { x: left + 490, color: colors.created, label: "Created", circle: true }
        ];

        entries.forEach((entry) => {
          if (entry.circle) {
            group.append(makeSvgElement("circle", {
              cx: entry.x + 6,
              cy: 29,
              r: 4,
              fill: entry.color
            }));
          } else {
            group.append(makeSvgElement("line", {
              x1: entry.x,
              x2: entry.x + 28,
              y1: 29,
              y2: 29,
              stroke: entry.color,
              "stroke-width": 2.4
            }));
            if (entry.square) {
              group.append(makeSvgElement("rect", {
                x: entry.x + 23,
                y: 24,
                width: 10,
                height: 10,
                fill: entry.color
              }));
            }
          }

          group.append(makeSvgElement("text", {
            x: entry.x + 38,
            y: 33,
            class: "legend-label"
          }, entry.label));
        });
      }

      function drawChart() {
        const sortedModels = models
          .map((model) => ({
            ...model,
            createdDate: utcDateFromUnix(model.created),
            shutdownDate: utcDateFromIso(model.shutdown)
          }))
          .sort((a, b) =>
            a.createdDate - b.createdDate || a.id.localeCompare(b.id)
          );

        const todayValue = new Date();
        const today = new Date(Date.UTC(
          todayValue.getUTCFullYear(),
          todayValue.getUTCMonth(),
          todayValue.getUTCDate()
        ));
        const shutdownDates = sortedModels
          .map((model) => model.shutdownDate)
          .filter(Boolean);
        const earliest = sortedModels[0].createdDate;
        const latest = new Date(Math.max(today, ...shutdownDates));
        const plotStart = new Date(earliest.getTime() - 30 * 86400000);
        const plotEnd = new Date(latest.getTime() + 90 * 86400000);

        const width = Math.max(1180, Math.min(1560, frame.clientWidth - 2));
        const left = 420;
        const right = 42;
        const top = 82;
        const rowHeight = 30;
        const bottom = 82;
        const axisY = top + sortedModels.length * rowHeight;
        const topAxisY = top - 8;
        const height = axisY + bottom;
        const plotWidth = width - left - right;
        const duration = plotEnd - plotStart;
        const x = (date) => left + ((date - plotStart) / duration) * plotWidth;

        svg.replaceChildren();
        svg.setAttribute("viewBox", "0 0 " + width + " " + height);
        svg.setAttribute("width", width);
        svg.setAttribute("height", height);

        svg.append(makeSvgElement("title", { id: "chart-title" },
          "OpenAI model availability timeline"));
        svg.append(makeSvgElement("desc", { id: "chart-description" },
          "A horizontal timeline for " + sortedModels.length +
          " models. Circles show creation dates and squares show announced shutdown dates."));

        const legend = makeSvgElement("g", { "aria-label": "Legend" });
        drawLegend(legend, left);
        svg.append(legend);

        svg.append(makeSvgElement("line", {
          x1: left,
          x2: width - right,
          y1: topAxisY,
          y2: topAxisY,
          class: "axis-line"
        }));

        let tick = new Date(Date.UTC(
          plotStart.getUTCFullYear(),
          plotStart.getUTCMonth() < 6 ? 0 : 6,
          1
        ));
        if (tick < plotStart) {
          tick = addUtcMonths(tick, 6);
        }

        while (tick <= plotEnd) {
          const tickX = x(tick);
          svg.append(makeSvgElement("line", {
            x1: tickX,
            x2: tickX,
            y1: topAxisY,
            y2: axisY,
            class: "grid-line"
          }));
          svg.append(makeSvgElement("line", {
            x1: tickX,
            x2: tickX,
            y1: topAxisY - 5,
            y2: topAxisY,
            class: "axis-line"
          }));
          svg.append(makeSvgElement("text", {
            x: tickX,
            y: topAxisY - 10,
            "text-anchor": "middle",
            class: "date-label"
          }, tick.toLocaleDateString("en-GB", {
            month: "short",
            year: "numeric",
            timeZone: "UTC"
          })));
          svg.append(makeSvgElement("line", {
            x1: tickX,
            x2: tickX,
            y1: axisY,
            y2: axisY + 5,
            class: "axis-line"
          }));
          svg.append(makeSvgElement("text", {
            x: tickX,
            y: axisY + 22,
            "text-anchor": "middle",
            class: "date-label"
          }, tick.toLocaleDateString("en-GB", {
            month: "short",
            year: "numeric",
            timeZone: "UTC"
          })));
          tick = addUtcMonths(tick, 6);
        }

        svg.append(makeSvgElement("line", {
          x1: left,
          x2: width - right,
          y1: axisY,
          y2: axisY,
          class: "axis-line"
        }));
        svg.append(makeSvgElement("text", {
          x: left + plotWidth / 2,
          y: axisY + 55,
          "text-anchor": "middle",
          class: "axis-title"
        }, ""));

        const todayX = x(today);
        svg.append(makeSvgElement("line", {
          x1: todayX,
          x2: todayX,
          y1: topAxisY,
          y2: axisY,
          class: "today-line"
        }));
        svg.append(makeSvgElement("text", {
          x: todayX,
          y: top + 8,
          "text-anchor": "middle",
          class: "today-label"
        }, "today"));

        sortedModels.forEach((model, index) => {
          const y = top + index * rowHeight + rowHeight / 2;
          const hasShutdown = Boolean(model.shutdownDate);
          const endDate = model.shutdownDate || plotEnd;
          const lineColor = hasShutdown ? colors.shutdown : colors.active;
          const group = makeSvgElement("g");

          group.append(makeSvgElement("title", {},
            model.id + ": released " + formatDate(model.createdDate) +
            (hasShutdown
              ? "; shutdown " + formatDate(model.shutdownDate)
              : "; no shutdown announced")));

          group.append(makeSvgElement("rect", {
            x: 0,
            y: y - rowHeight / 2,
            width,
            height: rowHeight,
            fill: "transparent"
          }));
          group.append(makeSvgElement("text", {
            x: left - 13,
            y: y + 4,
            "text-anchor": "end",
            class: "model-label"
          }, model.id));
          group.append(makeSvgElement("line", {
            x1: x(model.createdDate),
            x2: x(endDate),
            y1: y,
            y2: y,
            stroke: lineColor,
            "stroke-width": 2.4
          }));
          group.append(makeSvgElement("circle", {
            cx: x(model.createdDate),
            cy: y,
            r: 4,
            fill: colors.created
          }));

          if (hasShutdown) {
            group.append(makeSvgElement("rect", {
              x: x(model.shutdownDate) - 4.5,
              y: y - 4.5,
              width: 9,
              height: 9,
              fill: colors.shutdown
            }));
          }

          svg.append(group);
        });
      }

      drawChart();

      let resizeTimer;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(drawChart, 120);
      });
    </script>
  </body>
</html>
